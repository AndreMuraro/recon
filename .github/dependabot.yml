version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }
    ignore:
      # From 1.18 it needs Go 1.27, outside the support window while Go 1.26 is in it
      # (ADR 0002, ADR 0011). Remove when Go 1.28 is released.
      - dependency-name: github.com/databricks/databricks-sql-go
        versions: [">= 1.18.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  # PySpark, for the Databricks conformance job: one directory per Spark line, and the
  # 3.5 line only takes patch releases.
  - package-ecosystem: pip
    directory: /.github/requirements/spark-3.5
    schedule: { interval: weekly }
    ignore:
      - dependency-name: pyspark
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: pip
    directory: /.github/requirements/spark-4
    schedule: { interval: weekly }
    ignore:
      - dependency-name: pyspark
        update-types: ["version-update:semver-major"]
# Tool versions in mise.toml aren't a Dependabot ecosystem: see the comment there.
