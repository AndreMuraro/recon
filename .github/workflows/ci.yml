name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job gets more than it needs; nothing here can publish.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Tool versions live in mise.toml; jobs install them with jdx/mise-action.

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          version: 2026.10.25
          install_args: go golangci-lint zizmor
      - run: golangci-lint run
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: go.sum matches the Go checksum database
        # Entries are re-derived through proxy.golang.org and sum.golang.org, so a go.sum
        # written without the checksum database (or edited by hand) is caught here.
        run: |
          if [ -f go.sum ]; then cp go.sum go.sum.committed; rm go.sum; fi
          go mod download all
          go mod tidy
          if [ -f go.sum.committed ]; then diff go.sum.committed go.sum; fi
      - name: Workflow security (zizmor)
        run: zizmor --offline --format github .github/workflows/

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.26.x", "1.27.x"]  # the two supported Go releases
        include:
          - os: macos-latest
            go: "1.27.x"
          - os: windows-latest
            go: "1.27.x"
    defaults:
      run:
        shell: bash  # PowerShell would split -coverprofile=coverage.out at the dot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.mod
      - run: go vet ./...
      - run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out

  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          version: 2026.10.25
          install_args: go
      - name: Run every fuzz target for 30 seconds
        # go test -fuzz takes one target in one package, so each is run on its own.
        run: |
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              echo "::group::$pkg $target"
              go test -run='^$' -fuzz="^${target}\$" -fuzztime=30s "$pkg"
              echo "::endgroup::"
            done
          done

  conformance-duckdb:
    # Each dialect's SQL, run on the real engine, must produce exactly what the Go
    # reference encoder produces. Engines are reached through their official CLIs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RECON_DUCKDB: duckdb  # installed by mise, on the PATH
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          version: 2026.10.25
          install_args: go duckdb
      - run: duckdb -version
      - name: DuckDB conformance
        run: go test -count=1 -run DuckDBConformance -v ./internal/dialect
      - name: Diff on DuckDB
        run: go test -count=1 -race -run 'EngineDuckDB$' -v ./internal/diff
      - name: Schemas on DuckDB
        run: go test -count=1 -race -run 'EngineIntrospect/^duckdb$' -v ./internal/schema
      - name: recon diff on DuckDB
        run: go test -count=1 -race -run 'EngineDiff$' -v ./cmd/recon

  conformance-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15.19", "16.15", "17.11", "18.6"]  # the supported majors (14 ends 2026-11-12)
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          # A throwaway server reachable only from this job; no password to store.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RECON_POSTGRES: psql postgresql://postgres@localhost:5432/postgres
      RECON_DUCKDB: duckdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          version: 2026.10.25
          install_args: go duckdb
      - run: $RECON_POSTGRES --no-psqlrc --tuples-only --command 'SELECT version()'
      - name: Postgres conformance
        run: go test -count=1 -run PostgresConformance -v ./internal/dialect
      - name: Diff on Postgres, and DuckDB against Postgres
        run: go test -count=1 -race -run 'EnginePostgres|EngineDuckDBToPostgres' -v ./internal/diff
      - name: Schemas on Postgres
        run: go test -count=1 -race -run 'EngineIntrospect/^postgres$' -v ./internal/schema
      - name: Schemas matched across DuckDB and Postgres
        run: go test -count=1 -race -run 'EngineDuckDBToPostgres' -v ./internal/schema
      - name: recon diff from DuckDB to Postgres
        run: go test -count=1 -race -run 'EngineDiffDuckDBToPostgres' -v ./cmd/recon

  vulnerabilities:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          version: 2026.10.25
          install_args: go go:golang.org/x/vuln/cmd/govulncheck
      - name: Known vulnerabilities in reachable code (govulncheck)
        run: govulncheck ./...

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # GoReleaser reads the tags
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b  # v5.2.7
        with:
          version: 2026.10.25
          install_args: go goreleaser
          cache: false  # these binaries mirror a release; no cache a pull request could have written
      - name: Release configuration is valid, and a snapshot builds for every platform
        run: goreleaser release --snapshot --clean --skip=sbom
      - name: The binary runs
        run: |
          ./dist/recon_linux_amd64_v1/recon version
          ./dist/recon_linux_amd64_v1/recon version | grep -q '^recon '
