name: Release

# Version tags only. Kept apart from CI so that nothing published here can be influenced
# by caches written from pull requests; every job builds from a clean checkout.
on:
  push:
    tags: ["v*"]

permissions: {}

# Tool versions live in mise.toml. Every job installs them afresh: cache: false.

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          version: 2026.11.4
          install_args: go
          cache: false
      - run: go vet ./...
      - run: go test -race -shuffle=on ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release and upload archives
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # GoReleaser reads the previous tags
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          version: 2026.11.4
          install_args: go goreleaser
          cache: false
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56  # v0.24.4
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance for every archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
