# Tool versions for development and CI, in one place. Locally, `mise install` sets them
# up and `mise run check` runs what CI runs; in CI, jdx/mise-action installs the same
# versions. Dependabot doesn't read this file: `mise outdated` lists newer releases, and
# `mise upgrade --bump` updates the pins here.
#
# The test matrix in CI still installs Go with actions/setup-go, to test both supported
# releases (ADR 0002); the version here is the one everything else uses.
min_version = "2026.11.4"

# mise.lock records each tool's download URL and checksum per platform; jdx/mise-action
# installs with --locked when it is present. Regenerate it with `mise lock` after
# changing a version. It is lockfile format 4, which mise reads from 2026.11.1: CI's mise
# version and min_version must stay at or above that.
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
goreleaser = "2.20.0"
zizmor = "1.32.0"
duckdb = "2.0.0" # the CLI the DuckDB conformance and diff tests run (ADR 0003)

[tasks.test]
description = "Tests with the race detector (needs a C compiler on Windows)"
run = "go test -race -shuffle=on ./..."

[tasks.lint]
description = "Lint, format and module checks"
run = ["golangci-lint run", "go mod tidy -diff"]

[tasks.vuln]
description = "Known vulnerabilities in reachable code"
run = "govulncheck ./..."

[tasks.workflows]
description = "Security audit of the GitHub workflows"
run = "zizmor --offline .github/workflows/"

[tasks.engines]
description = "Conformance and diff tests on DuckDB, and on Postgres when RECON_POSTGRES is set"
env = { RECON_DUCKDB = "duckdb" }
run = 'go test -count=1 -run "Conformance|Engine" ./internal/dialect ./internal/diff ./internal/schema ./cmd/recon'

[tasks.snapshot]
description = "Build every release target locally, without publishing"
run = "goreleaser release --snapshot --clean --skip=sbom"

[tasks.check]
description = "Everything CI checks that runs locally"
depends = ["lint", "test", "vuln", "workflows", "engines"]
